<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); display: flex; flex-direction: column; gap: 12px; height: 100vh; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  p { margin: 0; color: var(--figma-color-text-secondary, #666); }
  .drop { flex: 1; min-height: 160px; display: flex; flex-direction: column; gap: 8px; border: 1px dashed var(--figma-color-border-strong, #bbb); border-radius: 8px; padding: 8px; }
  .drop[data-over] { border-color: var(--figma-color-border-brand, #0d99ff); background: var(--figma-color-bg-brand-tertiary, #e5f4ff); }
  textarea { flex: 1; width: 100%; resize: none; border: 0; background: transparent; color: inherit; font: 11px/1.4 ui-monospace, Menlo, monospace; outline: none; }
  .pick { color: var(--figma-color-text-secondary, #666); }
  .pick label { color: var(--figma-color-text-brand, #0d99ff); cursor: pointer; text-decoration: underline; }
  .pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .option { display: flex; gap: 8px; align-items: center; }
  button { height: 32px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible + span { outline: 2px solid var(--figma-color-border-brand, #0d99ff); outline-offset: 2px; }
  #status { white-space: pre-wrap; min-height: 18px; }
  #status[data-tone="error"] { color: var(--figma-color-text-danger, #d22); }
  #status[data-tone="ok"] { color: var(--figma-color-text-success, #14ae5c); }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <div class="drop" id="drop">
    <textarea id="input" spellcheck="false" aria-labelledby="intro"></textarea>
    <div class="pick"><span id="dropText"></span> <label><input type="file" id="file" accept=".json,application/json" /><span id="choose"></span></label></div>
  </div>
  <label class="option"><input type="checkbox" id="dark" /> <span id="darkText"></span></label>
  <label class="option"><input type="checkbox" id="flow" checked /> <span id="flowText"></span></label>
  <button id="create" disabled></button>
  <div id="status" role="status" aria-live="polite"></div>
  <script>/*__UI_SCRIPT__*/</script>
</body>
</html>
